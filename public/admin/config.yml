backend:
  name: turbo-github
  turbo_site_id: 4b2af71d-014c-4cb8-b118-860157b1f079
  branch: main
  cms_label_prefix: cms/

publish_mode: editorial_workflow
locale: zh_Hans
site_url: https://www.heyrickishere.com
display_url: https://www.heyrickishere.com

media_folder: public/images/cms-trial
public_folder: images/cms-trial

media_library:
  name: ricky-r2
  config:
    upload_url: https://ricky-media-upload.wby102150.workers.dev/
    editor_mode: production

collections:
  - name: blog
    label: 博客
    label_singular: 博客文章
    description: 日常记录与长文。未发布的文章从「工作流」继续编辑；换设备前请先保存。
    folder: src/content/blog
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    preview_path: "blog/{{slug}}/"
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    sortable_fields:
      - { field: date, label: 日期, default_sort: desc }
      - { field: title, label: 标题 }
    view_groups:
      - { label: 年份, field: date, pattern: '\d{4}' }
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 简介, name: description, widget: text, hint: 用一两句话介绍文章，会展示在文章列表与分享摘要中。 }
      - label: 日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - { label: 标签, name: tags, widget: list, required: false, default: [], hint: 多个标签用英文逗号分隔。 }
      - label: 封面
        name: cover
        widget: image
        required: false
        hint: 可留空。图片保存在 R2，上传后还需保存文章。
      - { label: 正文, name: body, widget: markdown, hint: 支持富文本与 Markdown 切换。换设备前请点保存，等待「修改已保存」。 }
      - label: 素材归档（自动）
        name: media_id
        widget: uuid
        hint: 自动生成并保持不变，用于归类本篇图片，无需填写。
      - { label: 站点草稿标记, name: draft, widget: hidden, default: false }
  - name: travel
    label: 游记
    label_singular: 游记
    description: 记录旅途、上传原图。未发布的文章从「工作流」继续编辑；换设备前请先保存。
    folder: src/content/travel
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    preview_path: "travel/{{slug}}/"
    summary: "{{date | date('YYYY-MM-DD')}} · {{title}}"
    sortable_fields:
      - { field: date, label: 日期, default_sort: desc }
      - { field: title, label: 标题 }
    view_groups:
      - { label: 年份, field: date, pattern: '\d{4}' }
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 简介, name: description, widget: text }
      - label: 日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: 封面
        name: cover
        widget: image
        hint: 上传原图或复用本篇游记的素材。上传后还需保存文章。
      - { label: 正文, name: body, widget: markdown, hint: 支持富文本与 Markdown 切换。换设备前请点保存，等待「修改已保存」。 }
      - label: 素材归档（自动）
        name: media_id
        widget: uuid
        hint: 自动生成并保持不变，用于归类本篇图片，无需填写。
      - { label: 站点草稿标记, name: draft, widget: hidden, default: false }
  - name: research
    label: 研究日志
    label_singular: 研究记录
    description: 记录研究进展、问题和阶段性判断。未发布的记录从「工作流」继续编辑；换设备前请先保存。
    folder: src/content/research
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{date | date(''YYYY-MM-DD'')}}-{{slug}}'
    preview_path: 'research/{{slug}}/'
    summary: '{{date | date(''YYYY-MM-DD'')}} · {{title}}'
    sortable_fields:
      - field: date
        label: 日期
        default_sort: desc
      - field: title
        label: 标题
    view_groups:
      - label: 年份
        field: date
        pattern: '\d{4}'
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: 摘要
        name: summary
        widget: text
        hint: 简要说明这次记录的研究问题、进展或结论。
      - label: 所属项目
        name: project
        widget: string
        required: false
        default: ''
      - label: 进展状态
        name: status
        widget: string
        required: false
        default: ''
      - label: 相关资料
        name: links
        widget: list
        required: false
        default: []
        collapsed: true
        summary: '{{fields.label}}'
        fields:
          - label: 名称
            name: label
            widget: string
          - label: 网页地址
            name: href
            widget: string
            pattern:
              - '^https?://[^\s\\\x00-\x1f\x7f]+$'
              - '请填写以 http:// 或 https:// 开头的网页地址。'
      - label: 正文
        name: body
        widget: markdown
        hint: 支持富文本与 Markdown 切换。换设备前请点保存，等待「修改已保存」。
      - label: 素材归档（自动）
        name: media_id
        widget: uuid
        hint: 自动生成并保持不变，用于归类本篇图片，无需填写。
      - label: 站点草稿标记
        name: draft
        widget: hidden
        default: false
  - name: pages
    label: 页面与站点
    label_singular: 页面
    description: 编辑首页、关于、近况、项目和站点简介。保存后从「工作流」预览并发布。
