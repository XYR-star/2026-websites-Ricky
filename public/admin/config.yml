    delete: false
    files:
      - name: homepage
        label: 首页
        file: src/data/homepage.json
        preview_path: /
        fields:
          - label: 首页布局版本
            name: layoutVersion
            widget: hidden
            required: false
            default: 1
          - label: 首页布局
            name: sections
            widget: list
            typeKey: type
            collapsed: true
            summary: '{{fields.title}}'
            hint: 拖动调整展示顺序，关闭「显示这一块」可暂时隐藏。杂志封面、继续阅读和首页开场各最多添加一块。
            types:
              - label: 杂志封面
                name: magazineCover
                widget: object
                summary: 杂志封面
                fields:
                  - label: 链接标记（自动）
                    name: id
                    widget: uuid
                    prefix: section-
                  - label: 显示这一块
                    name: enabled
                    widget: boolean
                    default: true
                  - label: 封面小标题
                    name: eyebrow
                    widget: string
                    required: false
                    default: 精选游记
                  - label: 封面游记
                    name: travelSlug
                    widget: relation
                    collection: travel
                    value_field: '{{slug}}'
                    search_fields: [title]
                    display_fields: [title]
                    multiple: false
                    required: false
                    hint: 选择一篇已发布且有封面的游记。留空时自动选取，所选游记不再可用时也会自动选取。
              - label: 继续阅读
                name: magazineContents
                widget: object
                summary: '{{fields.title}}'
                fields:
                  - label: 链接标记（自动）
                    name: id
                    widget: uuid
                    prefix: section-
                  - label: 显示这一块
                    name: enabled
                    widget: boolean
                    default: true
                  - label: 标题
                    name: title
                    widget: string
                    default: 继续阅读
                  - label: 展示篇数
                    name: count
                    widget: number
                    value_type: int
                    min: 1
                    max: 12
                    default: 2
                  - label: 链接文字
                    name: linkLabel
                    widget: string
                    required: false
                    default: 全部归档
                  - label: 链接地址
                    name: linkHref
                    widget: string
                    required: false
                    default: /archive
