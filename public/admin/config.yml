                      - >-
                        ^(?:https?://[^\s\\\x00-\x1f\x7f]+|/(?!/)[^\s\\\x00-\x1f\x7f]*|#[A-Za-z][A-Za-z0-9_-]*|mailto:[^@\s\\]+@[^@\s\\]+\.[^@\s\\]+)?$
