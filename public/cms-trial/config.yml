backend:
  name: turbo-github
  turbo_site_id: 4b2af71d-014c-4cb8-b118-860157b1f079
  branch: decap-preview
  cms_label_prefix: decap-preview/

publish_mode: editorial_workflow
locale: zh_Hans

media_folder: public/images/cms-trial
public_folder: images/cms-trial

media_library:
  name: ricky-r2
  config:
    upload_url: https://ricky-media-upload.wby102150.workers.dev/
    public_url: https://pub-9f290c4c2d7b479fad35f3c7051d2d9f.r2.dev

collections:
  - name: travel
    label: 游记
    folder: src/content/travel
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "travel/{{slug}}/"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 简介, name: description, widget: text }
      - label: 日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - { label: 封面, name: cover, widget: image }
      - { label: 站点草稿标记, name: draft, widget: hidden, default: false }
      - { label: 正文, name: body, widget: markdown }
