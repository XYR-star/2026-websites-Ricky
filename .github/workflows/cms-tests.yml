name: CMS editor tests

on:
  pull_request:
    branches: [main]
    paths:
      - public/admin/**
      - public/cms-trial/**
      - scripts/*.test.mjs
      - scripts/check-cms-changes.mjs
      - src/content.config.ts
      - src/data/**
      - src/lib/**
      - src/pages/**
      - package.json
      - package-lock.json
      - .github/workflows/cms-tests.yml
  push:
    branches: [main]
    paths:
      - public/admin/**
      - public/cms-trial/**
      - scripts/*.test.mjs
      - scripts/check-cms-changes.mjs
      - src/content.config.ts
      - src/data/**
      - src/lib/**
      - src/pages/**
      - package.json
      - package-lock.json
      - .github/workflows/cms-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: CMS editor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:cms
