name: Payload v2 checks

on:
  pull_request:
    branches: [main]
    paths: ['cms/**', 'src/lib/payload-*', 'scripts/payload-content.test.mjs', '.github/workflows/payload-v2.yml']
  push:
    branches: [feat/payload-v2]
    paths: ['cms/**', 'src/lib/payload-*', 'scripts/payload-content.test.mjs', '.github/workflows/payload-v2.yml']

permissions:
  contents: read

jobs:
  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run import:v1 -- --dry-run
      - run: npm run build
